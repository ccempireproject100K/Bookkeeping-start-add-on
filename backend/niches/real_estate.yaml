copilot_notes: |
  Agents are 1099: commission splits with the brokerage, desk fees,
  and cap tracking are the core math — know your true split on every
  deal. Pipeline is everything: track pending closings, not just closed
  revenue. Marketing spend per listing should tie to closed volume;
  mileage is a major deduction — log it. Referral fees are easy to
  forget; reconcile them quarterly.

