copilot_notes: |
  Roofing is lumpy: replacements are $10-20k tickets, repairs are quick
  cash. Track them separately. Storm season drives demand spikes —
  watch material costs (shingles) against quoted prices; supplier price
  hikes eat margin if bids lag. Insurance-claim jobs have slower pay
  cycles; track aging closely.

