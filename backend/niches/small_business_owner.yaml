copilot_notes: |
  New owners: this pack is the starter face for a business that is not
  one of the trade verticals — a shop, a studio, a food business, a
  small team selling products and services. The habits that matter most
  in year one: business and personal money never share an account,
  startup and formation costs tracked from the first receipt (they get
  special tax treatment), sales tax collected is a liability you hold —
  never revenue — and owner draws are not wages. Difference from the
  Freelancer pack: a freelancer sells their own skilled time project by
  project; an owner-operator runs a business with premises, stock, and
  a team, and the books should show it.

