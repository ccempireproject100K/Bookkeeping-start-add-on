copilot_notes: |
  Independent professionals live on 1099 income across multiple streams
  — track each stream separately for clean quarterly estimates. The big
  three deductions: home office, mileage, and health insurance premiums.
  Retainers are the annuity; project work is lumpy — know your baseline.
  Travel nurses: stipends vs taxable wages must stay separated, tax-home
  rules determine what's deductible, and multi-state assignments mean
  multi-state filings — keep assignment dates and locations on record.

