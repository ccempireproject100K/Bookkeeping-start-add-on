copilot_notes: |
  Credit repair runs on monthly plan revenue: the books live and die by
  active-client count and churn, not one-off jobs. Track setup/audit fees
  separately from recurring plan income — they behave differently and
  churn hits them differently. Bureau data and report pulls are a real
  per-client cost of goods; watch them against plan price. Affiliate
  income (credit-monitoring referrals) is high-margin but lumpy — never
  let it mask a shrinking client base. Compliance is existential here:
  the federal Credit Repair Organizations Act restricts when consumer
  fees can be charged, and many states require registration and a surety
  bond — keep bond premiums and renewal dates on the books, not in a
  drawer.

