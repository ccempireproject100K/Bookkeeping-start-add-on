copilot_notes: |
  Tree service is high-ticket and often urgent: removals can run
  into the thousands. Storm work spikes demand — and prices.
  Equipment (chippers, cranes) is the big fixed cost; utilization
  is everything. Insurance is non-negotiable in this trade.
