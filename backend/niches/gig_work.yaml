copilot_notes: |
  Gig income has no withholding: every platform payout is gross until
  you set aside the tax yourself, so quarterly estimates are the whole
  game. Keep each platform's stream separate — rideshare, delivery, and
  task apps issue different 1099 flavors (NEC vs K) and net their fees
  differently, and year-end reconciliation is painless only if the
  streams never mix. Mileage is the deduction that pays for this pack:
  business miles from the moment the app goes on, logged daily — a
  platform's year-end summary is never the full count. Difference from
  the Freelancer pack: a freelancer contracts directly with clients;
  a gig worker's work is mediated by platforms that set the price,
  take a service fee, and pay on their own schedule.

