copilot_notes: |
  HVAC shops live and die by season: installs spike in summer/winter,
  maintenance agreements smooth the shoulders. Track install vs service
  revenue separately — installs are lumpy, service is the baseline.
  Watch refrigerant costs and callback rates; callbacks eat margin fast.

