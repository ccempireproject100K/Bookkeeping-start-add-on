copilot_notes: |
  Restoration is emergency + insurance: jobs are big tickets but
  insurance pay cycles are slow — track receivables aging ruthlessly.
  Xactimate-style line-item pricing is the industry language.
  Drying equipment is a major asset; track utilization and
  depreciation. Referrals from plumbers are a top lead source.

