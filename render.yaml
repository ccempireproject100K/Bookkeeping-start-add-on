# Render Blueprint: bookkeeping API + web frontend.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Fill in MONGO_URL (Atlas connection string), FRONTEND_URL, and
# REACT_APP_BACKEND_URL when prompted. JWT_SECRET is auto-generated.
services:
  - type: web
    name: bookkeeping-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: bookkeeping
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Optional integrations (add when you have the keys):
      # - key: PLAID_CLIENT_ID
      # - key: PLAID_SECRET
      # - key: EMERGENT_LLM_KEY
      # Federated sign-in (per provider; a provider is OFF — button
      # hidden, endpoints 404 — until ALL THREE of its keys are set).
      # Redirect URIs registered at each provider console must be the
      # API host + /api/auth/<provider>/callback, e.g.
      # https://bookkeeping-api.onrender.com/api/auth/google/callback
      # - key: GOOGLE_CLIENT_ID
      # - key: GOOGLE_CLIENT_SECRET
      # - key: GOOGLE_REDIRECT_URI
      # - key: FACEBOOK_CLIENT_ID
      # - key: FACEBOOK_CLIENT_SECRET
      # - key: FACEBOOK_REDIRECT_URI
      # - key: MICROSOFT_CLIENT_ID
      # - key: MICROSOFT_CLIENT_SECRET
      # - key: MICROSOFT_REDIRECT_URI
      # - key: MICROSOFT_TENANT (optional, default "common" = personal + work accounts)
      # - key: LINKEDIN_CLIENT_ID
      # - key: LINKEDIN_CLIENT_SECRET
      # - key: LINKEDIN_REDIRECT_URI
      # Apple: plumbing ready-only; activation gated on the paid Apple
      # Developer Program (owner decision). No keys this wave.
      # Scheduled collections autopilot (off unless ENABLE_SCHEDULER=true):
      - key: ENABLE_SCHEDULER
        value: false
      - key: COLLECTIONS_RUN_TIME
        value: "06:00"
      - key: SCHEDULER_TZ
        value: America/Chicago

  - type: web
    name: bookkeeping-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
