# Render Blueprint: bookkeeping API + web frontend.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Fill in MONGO_URL (Atlas connection string), FRONTEND_URL, and
# REACT_APP_BACKEND_URL when prompted. JWT_SECRET is auto-generated.
services:
  - type: web
    name: bookkeeping-api
    runtime: python
    # The tax engine (tax-engine/, TypeScript) must be compiled for the
    # tax-packet and welcome-gift estimates; without it they answer 503
    # "engine_not_built". Render's native runtimes include Node.js.
    buildCommand: pip install -r backend/requirements.txt && cd tax-engine && npm ci --include=dev && npm run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Node runs the tax engine at build and request time; pin a
      # supported release instead of whatever Render defaults to.
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: bookkeeping
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Optional integrations (add when you have the keys):
      # - key: PLAID_CLIENT_ID
      # - key: PLAID_SECRET
      # - key: AI_API_KEY
      # Scheduled collections autopilot (off unless ENABLE_SCHEDULER=true):
      - key: ENABLE_SCHEDULER
        value: false
      - key: COLLECTIONS_RUN_TIME
        value: "06:00"
      - key: SCHEDULER_TZ
        value: America/Chicago

  - type: web
    name: bookkeeping-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
